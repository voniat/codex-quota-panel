<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 额度</title>
<style>
:root{color-scheme:light;--bg:#fff;--card:#f8fafb;--text:#1e293b;--muted:#697586;--border:#e4e9ef;--green:#168365;--purple:#7560ce;--track:#e8edf1;--blue:#3276e8;--safe-top:0px;--safe-right:0px;--safe-bottom:0px;--safe-left:0px}
:root[data-theme=dark]{color-scheme:dark;--bg:#17191d;--card:#202329;--text:#eef2f7;--muted:#9ba6b5;--border:#343a43;--green:#71dcb5;--purple:#b3a0ff;--track:#363c45;--blue:#78a9ff}
*{box-sizing:border-box}body{margin:0;background:var(--color-background-primary,var(--bg));color:var(--color-text-primary,var(--text));font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI",sans-serif}main{max-width:520px;margin:0 auto;padding:calc(24px + var(--safe-top)) calc(22px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(22px + var(--safe-left))}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}h1{font-size:20px;line-height:1.3;margin:0 0 5px;letter-spacing:-.4px}.subtitle{font-size:12px;color:var(--muted)}.badge{font-size:11px;letter-spacing:.5px;padding:4px 9px;border:1px solid var(--border);border-radius:20px;color:var(--muted);white-space:nowrap}.card{padding:20px 20px 18px;margin-bottom:14px;border:1px solid var(--border);border-radius:15px;background:var(--color-background-secondary,var(--card));--accent:var(--green)}#weekly{--accent:var(--purple)}.label{font-size:13px;color:var(--muted);margin-bottom:7px}.amount{font-size:44px;line-height:1.2;letter-spacing:-1.3px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--accent)}.reset{font-size:12px;color:var(--muted);margin-top:12px}.track{height:6px;background:var(--track);border-radius:9px;overflow:hidden;margin-top:18px}.fill{height:100%;background:var(--accent);width:0;border-radius:9px;transition:width .25s}.unknown .amount{color:var(--muted);font-size:34px;line-height:1.55}footer{margin-top:25px}.source{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.source:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}.source[data-kind=live]{color:var(--green)}.source[data-kind=error]{color:#cd6551}.source[data-kind=snapshot]{color:#ad813c}.recorded{font-size:12px;color:var(--muted);margin-top:5px}.actions{margin-top:21px;display:flex;align-items:center;justify-content:space-between;gap:10px}.countdown{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}button{font:inherit;font-size:13px;font-weight:500;color:var(--blue);background:transparent;border:1px solid var(--border);border-radius:9px;padding:9px 15px;min-height:38px;cursor:pointer;white-space:nowrap}button:hover{background:var(--card);border-color:var(--blue)}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button:disabled{opacity:.55;cursor:wait}.timezone{font-size:11px;color:var(--muted);margin-top:20px;opacity:.8}@media(max-width:300px){main{padding:17px 14px}.card{padding:17px}.actions{flex-wrap:wrap}button{width:100%}.badge{font-size:10px}}
</style></head><body><main>
<header><div><h1>剩余额度</h1><div class="subtitle">每 5 分钟自动更新</div></div><span class="badge" id="plan">当前账号</span></header>
<section class="card" id="five-hour" aria-label="5 小时剩余额度"><div class="label">5 小时</div><div class="amount">—</div><div class="track"><div class="fill"></div></div><div class="reset">正在读取…</div></section>
<section class="card" id="weekly" aria-label="每周剩余额度"><div class="label">每周</div><div class="amount">—</div><div class="track"><div class="fill"></div></div><div class="reset">正在读取…</div></section>
<footer><div class="source" id="status" role="status">正在连接…</div><div class="recorded" id="recorded">尚未读取额度</div><div class="actions"><span class="countdown" id="countdown">下次刷新 05:00</span><button id="refresh" type="button" disabled>立即刷新</button></div><div class="timezone">时间以北京时间显示</div></footer>
</main><script>/*APP_SCRIPT*/</script></body></html>
